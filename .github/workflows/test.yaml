name: Test

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v2
      - run: make lint

  test-71:
    runs-on: ubuntu-latest
    needs: lint
    steps:

      - uses: actions/checkout@v2
      - run: make test-image IMAGE="php:7.1-fpm-alpine" DOCKERFILE="alpine"

  test-72:
